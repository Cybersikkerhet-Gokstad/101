<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modul 1 – Se hva som skal beskyttes | Cybersecurity 101</title>
<style>
/* ============================================================
   Cybersecurity 101 - Modul 1 : S – Se hva som skal beskyttes
   Selvstendig HTML + CSS + JavaScript. Ingen eksterne filer.
   Alt er navnesatt under .m1 slik at Moodle-temaet ikke kolliderer.
   Fremdrift lagres lokalt i nettleseren (localStorage).
   ============================================================ */
html,body{margin:0;padding:0;background:#F4F6F8;}

.m1{
  --navy:#0E2233; --navy2:#16324B; --slate:#1D4E6B;
  --amber:#F5A623; --amberD:#9A5F00; --amberS:#FFF5E3;
  --ember:#C9503C; --emberS:#FBECE8;
  --mint:#2F9A7D; --mintS:#E3F4EE;
  --sky:#2F74B5; --skyS:#E7F0FA;
  --violet:#6E54B8; --violetS:#EFEAFA;
  --ink:#16324B; --muted:#5D7183; --mutedl:#9BB2C4;
  --bg:#F4F6F8; --mist:#EDF2F6; --card:#F7FAFC; --line:#DCE6ED; --white:#fff;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:16px;
  --shadow:0 1px 2px rgba(14,34,51,.05),0 10px 30px rgba(14,34,51,.08);
  font-family:var(--sans);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;
}
.m1 *,.m1 *::before,.m1 *::after{box-sizing:border-box;}
.m1 h1,.m1 h2,.m1 h3,.m1 h4,.m1 p,.m1 ul,.m1 ol,.m1 li,.m1 figure{margin:0;padding:0;}
.m1 ul,.m1 ol{list-style:none;}
.m1 button{font-family:inherit;color:inherit;}
.m1 a{color:var(--sky);}
.m1 svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.m1 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.m1 :focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px;}
.m1 h1[tabindex="-1"]:focus,.m1 .m1-stage:focus{outline:none;}

/* ---------- topplinje ---------- */
.m1-top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);}
.m1-top-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px;}
.m1-brand{display:flex;align-items:center;gap:12px;min-width:0;}
.m1-logo{width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--amber);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 4px 12px rgba(14,34,51,.25);}
.m1-brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.m1-brand b{display:block;font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m1-prog{flex:1;display:flex;align-items:center;gap:12px;min-width:120px;}
.m1-bar{flex:1;height:8px;background:var(--mist);border-radius:99px;overflow:hidden;position:relative;}
.m1-bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--amber),#FFC45C);border-radius:99px;transition:width .7s cubic-bezier(.3,.8,.3,1);}
.m1-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:m1Shine 2.4s infinite;}
.m1-pct{font-weight:800;font-size:14px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;}
.m1-pill{display:flex;align-items:center;gap:6px;background:var(--amberS);color:var(--amberD);font-weight:800;font-size:13.5px;padding:7px 12px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.m1-pill.bump{animation:m1Pop .5s;}
.m1-menu{display:none;border:0;background:var(--mist);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;place-items:center;}

/* ---------- oppsett ---------- */
.m1-layout{max-width:1280px;margin:0 auto;padding:24px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start;}
.m1-side{position:sticky;top:88px;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 14px;max-height:calc(100vh - 110px);overflow:auto;}
.m1-side h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px;}
.m1-side h4:first-child{margin-top:0;}
.m1-nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 8px;border-radius:10px;text-align:left;font-size:13.5px;cursor:pointer;color:var(--ink);transition:background .15s;}
.m1-nav button:hover:not(:disabled){background:var(--mist);}
.m1-nav button:disabled{cursor:not-allowed;color:var(--mutedl);}
.m1-nav button.cur{background:var(--amberS);font-weight:700;}
.m1-nav .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;border:2px solid var(--line);background:#fff;color:var(--mutedl);}
.m1-nav .done .st{background:var(--mint);border-color:var(--mint);color:#fff;}
.m1-nav .cur .st{border-color:var(--amber);color:var(--amberD);box-shadow:0 0 0 4px rgba(245,166,35,.2);}
.m1-side-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px;}
.m1-side-foot p{font-size:12px;color:var(--muted);padding:0 8px;}
.m1-link{border:0;background:none;color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;cursor:pointer;padding:6px 8px;border-radius:8px;}
.m1-link:hover{background:var(--mist);color:var(--ember);}

.m1-main{background:var(--white);border-radius:22px;box-shadow:var(--shadow);min-height:calc(100vh - 140px);display:flex;flex-direction:column;}
.m1-stage{flex:1;padding:44px 52px 28px;}
.m1-foot{display:flex;align-items:center;gap:12px;padding:16px 52px;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0;border-radius:0 0 22px 22px;z-index:5;}
.m1-foot .hint{flex:1;text-align:center;font-size:13px;color:var(--muted);}
.m1-foot .hint.ok{color:var(--mint);font-weight:700;}
.m1-scrim{display:none;}

/* ---------- knapper ---------- */
.m1 .btn{font-size:14.5px;font-weight:700;padding:11px 20px;border-radius:99px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .16s,box-shadow .16s,background .16s,opacity .16s;text-decoration:none;}
.m1 .btn:hover:not(:disabled){transform:translateY(-2px);}
.m1 .btn:disabled{opacity:.45;cursor:not-allowed;}
.m1 .btn-p{background:var(--amber);color:var(--navy);box-shadow:0 4px 14px rgba(245,166,35,.35);}
.m1 .btn-p:hover:not(:disabled){box-shadow:0 8px 22px rgba(245,166,35,.45);}
.m1 .btn-d{background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(14,34,51,.25);}
.m1 .btn-s{background:var(--mist);color:var(--ink);}
.m1 .btn-s:hover:not(:disabled){background:#E2EAF0;}
.m1 .btn-sm{font-size:13px;padding:8px 14px;}
.m1 .btn.ready{animation:m1Nudge 1.4s ease-in-out 2;}

/* ---------- typografi ---------- */
.m1 .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--amberD);margin-bottom:10px;}
.m1 .eyebrow .n{background:var(--amberS);padding:3px 8px;border-radius:6px;letter-spacing:.05em;}
.m1 h1.t{font-family:var(--serif);font-size:clamp(30px,4.2vw,46px);line-height:1.1;font-weight:700;margin-bottom:14px;letter-spacing:-.01em;}
.m1 h2.t{font-family:var(--serif);font-size:clamp(22px,2.6vw,28px);line-height:1.2;margin:34px 0 10px;}
.m1 h3{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:6px;}
.m1 .lede{font-size:18px;color:var(--muted);line-height:1.6;max-width:70ch;}
.m1 .prose p{font-size:16px;line-height:1.7;max-width:72ch;margin-top:12px;}
.m1 .prose ul.dots{margin-top:10px;display:grid;gap:8px;max-width:72ch;}
.m1 ul.dots li{position:relative;padding-left:22px;font-size:15.5px;line-height:1.6;}
.m1 ul.dots li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--amber);}
.m1 .muted{color:var(--muted);}
.m1 .small{font-size:13px;}
.m1 mark{background:linear-gradient(transparent 55%,rgba(245,166,35,.35) 55%);color:inherit;padding:0 2px;}
.m1 .src{font-size:12px;color:var(--muted);font-style:italic;margin-top:10px;}
.m1 .mod{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--mist);color:var(--slate);letter-spacing:.03em;}

/* ---------- blokker ---------- */
.m1 .grid{display:grid;gap:16px;}
.m1 .g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.m1 .g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.m1 .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.m1 .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;}
.m1 .card.lift{transition:transform .2s,box-shadow .2s;}
.m1 .card.lift:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(14,34,51,.10);}
.m1 .card p{font-size:14.5px;color:var(--muted);line-height:1.55;}
.m1 .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;margin-bottom:12px;background:var(--amberS);color:var(--amberD);}
.m1 .callout{border-radius:var(--r);padding:18px 20px 18px 58px;position:relative;margin-top:22px;border:1px solid transparent;}
.m1 .callout>.ci{position:absolute;left:18px;top:18px;font-size:24px;}
.m1 .callout h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
.m1 .callout p{font-size:15px;line-height:1.6;}
.m1 .callout p+p{margin-top:8px;}
.m1 .c-fact{background:var(--amberS);border-color:#F8DDAE;} .m1 .c-fact h4,.m1 .c-fact .ci{color:var(--amberD);}
.m1 .c-warn{background:var(--emberS);border-color:#F2CFC6;} .m1 .c-warn h4,.m1 .c-warn .ci{color:var(--ember);}
.m1 .c-tip{background:var(--mintS);border-color:#C4E8DB;} .m1 .c-tip h4,.m1 .c-tip .ci{color:var(--mint);}
.m1 .c-info{background:var(--skyS);border-color:#CADDF1;} .m1 .c-info h4,.m1 .c-info .ci{color:var(--sky);}
.m1 .task{margin-top:26px;border:2px dashed #D4E0E9;border-radius:20px;padding:22px;background:#FBFDFE;}
.m1 .task-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.m1 .task-h .tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--navy);color:#fff;padding:4px 9px;border-radius:6px;}
.m1 .task-h b{font-family:var(--serif);font-size:18px;}
.m1 .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--mist);color:var(--ink);border:1px solid transparent;}
.m1 .chips{display:flex;flex-wrap:wrap;gap:8px;}
.m1 .stat{font-family:var(--serif);font-size:clamp(34px,4.6vw,50px);font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.m1 .quote{font-family:var(--serif);font-size:clamp(20px,2.4vw,26px);line-height:1.4;border-left:4px solid var(--amber);padding:6px 0 6px 20px;margin-top:20px;}

/* ---------- skjema ---------- */
.m1 textarea,.m1 input[type=text]{width:100%;font-family:inherit;font-size:15.5px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;transition:border-color .15s,box-shadow .15s;resize:vertical;}
.m1 textarea:focus,.m1 input[type=text]:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,166,35,.18);}
.m1 label.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--slate);}
.m1 .saved{font-size:12.5px;color:var(--mint);font-weight:700;opacity:0;transition:opacity .3s;}
.m1 .saved.on{opacity:1;}

/* ---------- svaralternativer / tilbakemelding ---------- */
.m1 .q{font-weight:700;font-size:16.5px;margin-bottom:12px;line-height:1.45;}
.m1 .opts{display:grid;gap:10px;}
.m1 .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.45;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;}
.m1 .opt:hover:not(:disabled){border-color:var(--amber);transform:translateX(3px);}
.m1 .opt .k{width:26px;height:26px;border-radius:8px;background:var(--mist);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none;color:var(--slate);}
.m1 .opt.ok{border-color:var(--mint);background:var(--mintS);}
.m1 .opt.ok .k{background:var(--mint);color:#fff;}
.m1 .opt.no{border-color:var(--ember);background:var(--emberS);animation:m1Shake .4s;}
.m1 .opt.no .k{background:var(--ember);color:#fff;}
.m1 .opt:disabled{cursor:default;}
.m1 .fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.55;display:none;}
.m1 .fb.show{display:block;animation:m1Rise .35s both;}
.m1 .fb.good{background:var(--mintS);color:#1D5E4C;}
.m1 .fb.bad{background:var(--emberS);color:#8A3526;}

/* ---------- sorteringsspill ---------- */
.m1 .pool{display:flex;flex-wrap:wrap;gap:10px;padding:16px;border-radius:16px;background:var(--mist);min-height:66px;align-items:center;}
.m1 .pool:empty::after{content:"Alt er sortert!";color:var(--mint);font-weight:700;margin:auto;}
.m1 .itm{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;cursor:grab;display:inline-flex;text-align:left;gap:7px;align-items:center;box-shadow:0 2px 4px rgba(14,34,51,.05);transition:transform .15s,box-shadow .15s,border-color .15s;user-select:none;}
.m1 .itm:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(14,34,51,.1);}
.m1 .itm.sel{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,166,35,.25);transform:translateY(-2px);}
.m1 .itm.placed{cursor:default;border-color:transparent;background:#fff;font-size:13px;padding:6px 10px;animation:m1Pop .35s;}
.m1 .itm.bad{animation:m1Shake .4s;border-color:var(--ember);}
.m1 .bins{display:grid;gap:12px;margin-top:14px;}
.m1 .bin{border:2px dashed var(--line);border-radius:16px;padding:12px;background:#fff;min-height:96px;transition:border-color .15s,background .15s,transform .15s;cursor:pointer;display:flex;flex-direction:column;gap:8px;}
.m1 .bin:hover,.m1 .bin.over{border-color:var(--amber);background:var(--amberS);}
.m1 .bin.flash{animation:m1Flash .5s;}
.m1 .bin-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;}
.m1 .bin-h .bi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:#fff;flex:none;}
.m1 .bin-l{display:flex;flex-wrap:wrap;gap:6px;}
.m1 .sortfb{min-height:24px;margin-top:10px;font-size:14px;font-weight:600;}
.m1 .sortfb.good{color:var(--mint);} .m1 .sortfb.bad{color:var(--ember);}

/* ---------- kortstokk ---------- */
.m1 .deck{max-width:680px;margin:18px auto 0;}
.m1 .deck-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:700;}
.m1 .pips{display:flex;gap:5px;}
.m1 .pips i{width:22px;height:6px;border-radius:9px;background:var(--line);transition:background .3s;}
.m1 .pips i.ok{background:var(--mint);} .m1 .pips i.no{background:var(--ember);} .m1 .pips i.on{background:var(--amber);}
.m1 .dcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 14px 34px rgba(14,34,51,.10);animation:m1Deal .45s cubic-bezier(.2,.8,.3,1) both;position:relative;}
.m1 .dcard .sit{font-size:18px;line-height:1.5;font-family:var(--serif);}
.m1 .dcard .sit-ico{width:52px;height:52px;border-radius:16px;background:var(--mist);display:grid;place-items:center;font-size:26px;margin-bottom:14px;color:var(--slate);}
.m1 .dchoices{display:grid;gap:10px;margin-top:20px;}
.m1 .dchoices.c3{grid-template-columns:repeat(3,1fr);}
.m1 .dchoices.c2{grid-template-columns:repeat(2,1fr);}
.m1 .dbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;font-weight:800;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s,border-color .15s,background .15s;}
.m1 .dbtn small{font-weight:600;font-size:12px;color:var(--muted);}
.m1 .dbtn:hover:not(:disabled){transform:translateY(-3px);border-color:var(--amber);}
.m1 .dbtn.ok{border-color:var(--mint);background:var(--mintS);}
.m1 .dbtn.no{border-color:var(--ember);background:var(--emberS);animation:m1Shake .4s;}
.m1 .dbtn:disabled{cursor:default;}
.m1 .stamp{position:absolute;top:18px;right:18px;font-weight:900;font-size:13px;letter-spacing:.14em;padding:6px 10px;border:3px solid;border-radius:8px;transform:rotate(8deg);animation:m1Stamp .4s cubic-bezier(.3,1.6,.5,1) both;}
.m1 .stamp.ok{color:var(--mint);} .m1 .stamp.no{color:var(--ember);}
.m1 .dsum{text-align:center;padding:30px;}
.m1 .dsum .big{font-family:var(--serif);font-size:54px;font-weight:700;}

/* ---------- SIKRE-sirkel (intro) ---------- */
.m1 .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:30px;align-items:center;}
.m1 .sikre{width:100%;max-width:340px;margin:auto;display:block;}
.m1 .sikre .ring{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 6;animation:m1Spin 60s linear infinite;transform-origin:130px 130px;}
.m1 .sikre .node circle{fill:#fff;stroke:var(--line);stroke-width:2;}
.m1 .sikre .node text{font-family:var(--serif);font-weight:700;font-size:22px;fill:var(--mutedl);text-anchor:middle;dominant-baseline:central;}
.m1 .sikre .node.on circle{fill:var(--amber);stroke:var(--amber);}
.m1 .sikre .node.on text{fill:var(--navy);}
.m1 .sikre .pulse{fill:none;stroke:var(--amber);stroke-width:2;animation:m1Pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center;}
.m1 .goal{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
.m1 .goal:last-child{border-bottom:0;}
.m1 .goal .gi{width:36px;height:36px;border-radius:10px;background:var(--mist);display:grid;place-items:center;font-size:18px;color:var(--slate);flex:none;}
.m1 .goal p{font-size:15.5px;line-height:1.5;padding-top:6px;}

/* ---------- hus-analogi ---------- */
.m1 .house{position:relative;max-width:420px;margin:auto;}
.m1 .house svg{width:100%;display:block;}
.m1 .hot{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:0;background:var(--amber);color:var(--navy);font-size:22px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(245,166,35,.45);transition:transform .2s,background .2s;}
.m1 .hot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--amber);animation:m1Pulse 2s ease-out infinite;}
.m1 .hot.seen{background:var(--mint);color:#fff;box-shadow:0 6px 16px rgba(47,154,125,.35);}
.m1 .hot.seen::after{display:none;}
.m1 .hot:hover{transform:translate(-50%,-50%) scale(1.1);}
.m1 .hot.act{box-shadow:0 0 0 6px rgba(14,34,51,.15);}
.m1 .hpanel{min-height:170px;}
.m1 .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:12px;animation:m1Rise .4s both;}
.m1 .pair .side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
.m1 .pair .side small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.m1 .pair .side.dig{background:var(--skyS);border-color:#CADDF1;}
.m1 .pair .arr{font-size:22px;color:var(--amberD);}
.m1 .habits{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;}
.m1 .habit{background:var(--navy);color:#fff;border-radius:16px;padding:18px;position:relative;overflow:hidden;}
.m1 .habit .hn{font-family:var(--serif);font-size:34px;color:var(--amber);line-height:1;}
.m1 .habit p{font-size:14px;color:#D3E0EA;margin-top:8px;line-height:1.5;}

/* ---------- vippekort ---------- */
.m1 .flip{perspective:1000px;cursor:pointer;min-height:220px;border:0;background:none;padding:0;text-align:left;width:100%;}
.m1 .flip-in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;}
.m1 .flip-in{min-height:220px;}
.m1 .flip.on .flip-in{transform:rotateY(180deg);}
.m1 .flip-f,.m1 .flip-b{position:absolute;inset:0;border-radius:var(--r);padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;}
.m1 .flip-f{background:var(--navy);color:#fff;justify-content:space-between;}
.m1 .flip-f h3{color:#fff;font-size:20px;}
.m1 .flip-f .tap{font-size:12px;color:var(--mutedl);display:flex;gap:6px;align-items:center;}
.m1 .flip-b{background:var(--amberS);border:1px solid #F8DDAE;transform:rotateY(180deg);justify-content:center;}
.m1 .flip-b p{font-size:14.5px;line-height:1.55;color:var(--ink);}

/* ---------- rekkefølge-puslespill ---------- */
.m1 .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
.m1 .slot{border:2px dashed var(--line);border-radius:14px;min-height:78px;display:flex;align-items:center;gap:10px;padding:12px;font-family:var(--serif);font-size:17px;font-weight:700;background:#fff;}
.m1 .slot .sn{width:30px;height:30px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:800;flex:none;color:var(--muted);}
.m1 .slot.fill{border-style:solid;border-color:var(--mint);background:var(--mintS);animation:m1Pop .35s;}
.m1 .slot.fill .sn{background:var(--mint);color:#fff;}
.m1 .frames{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;position:relative;}
.m1 .frame{border-radius:16px;padding:18px;background:#fff;border:1px solid var(--line);text-align:center;}
.m1 .frame small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.m1 .frame .fb1{font-family:var(--serif);font-weight:700;font-size:17px;margin:8px 0 10px;}
.m1 .frame .first{display:inline-block;background:var(--amber);color:var(--navy);font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px;animation:m1Pop .5s both;}
.m1 .frame .rest{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.m1 .frame .rest span{font-size:11px;background:var(--mist);color:var(--muted);padding:3px 7px;border-radius:6px;}

/* ---------- Saras dag ---------- */
.m1 .sara{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:18px;}
.m1 .ava{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FFD7A0,#F5A623);display:grid;place-items:center;font-family:var(--serif);font-size:28px;font-weight:700;color:var(--navy);flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);}
.m1 .tl{position:relative;margin-top:24px;padding-left:34px;}
.m1 .tl::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px;}
.m1 .tl-fill{position:absolute;left:12px;top:6px;width:3px;background:var(--amber);border-radius:3px;transition:height .6s;}
.m1 .ev{position:relative;margin-bottom:18px;}
.m1 .ev::before{content:"";position:absolute;left:-29px;top:18px;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--line);}
.m1 .ev.act::before{border-color:var(--amber);box-shadow:0 0 0 5px rgba(245,166,35,.2);}
.m1 .ev.fin::before{background:var(--mint);border-color:var(--mint);}
.m1 .ev.lock{opacity:.45;}
.m1 .ev-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;transition:box-shadow .2s;}
.m1 .ev.act .ev-box{box-shadow:0 12px 30px rgba(14,34,51,.10);border-color:#F3D29A;}
.m1 .ev-time{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--amberD);font-variant-numeric:tabular-nums;}
.m1 .ev-time .i{animation:m1Spin 6s linear infinite;}
.m1 .ev-sit{font-size:15.5px;line-height:1.6;margin:6px 0 12px;}
.m1 .reveal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;animation:m1Rise .4s both;}
.m1 .reveal div{border-radius:12px;padding:10px 12px;font-size:13.5px;}
.m1 .reveal small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75;}
.m1 .reveal .trap{background:var(--emberS);color:#8A3526;}
.m1 .reveal .val{background:var(--skyS);color:#1E4E7C;}
.m1 .ev.lock .ev-body{display:none;}

/* ---------- kategoriutforsker ---------- */
.m1 .dual{display:grid;gap:14px;margin-top:14px;}
.m1 .dual-row{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;}
.m1 .dual-row b{font-size:14.5px;}
.m1 .meter{display:grid;gap:6px;}
.m1 .meter div{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700;}
.m1 .meter span{height:10px;border-radius:9px;background:var(--mist);overflow:hidden;position:relative;}
.m1 .meter span i{position:absolute;inset:0 auto 0 0;border-radius:9px;width:0;transition:width 1.2s cubic-bezier(.3,.8,.3,1);}
.m1 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.m1 .tile{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;}
.m1 .tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(14,34,51,.08);}
.m1 .tile .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;color:#fff;flex:none;}
.m1 .tile b{font-size:14.5px;line-height:1.3;display:block;}
.m1 .tile small{font-size:12px;color:var(--muted);}
.m1 .tile.act{border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,34,51,.1);}
.m1 .tile .ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--mint);color:#fff;display:none;place-items:center;font-size:11px;}
.m1 .tile.seen .ck{display:grid;animation:m1Pop .35s;}
.m1 .detail{margin-top:16px;border-radius:20px;padding:26px;background:var(--card);border:1px solid var(--line);animation:m1Rise .4s both;}
.m1 .detail-h{display:flex;gap:14px;align-items:center;margin-bottom:6px;}
.m1 .detail-h .ti{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:25px;color:#fff;flex:none;}
.m1 .detail .prose p:first-child{margin-top:4px;}
.m1 .twoq{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.m1 .twoq div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;}
.m1 .twoq b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amberD);margin-bottom:3px;}
.m1 .chain{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;}
.m1 .chain span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;animation:m1Rise .4s both;}
.m1 .chain .i{color:var(--amberD);}
.m1 .chain span.hot2{background:var(--navy);color:#fff;border-color:var(--navy);}
.m1 .rule{background:var(--navy);color:#fff;border-radius:20px;padding:26px 28px;margin-top:20px;position:relative;overflow:hidden;}
.m1 .rule h4{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;display:flex;gap:8px;align-items:center;}
.m1 .rule p{font-size:16px;line-height:1.6;color:#DCE7EF;}
.m1 .rule .big{font-family:var(--serif);font-size:24px;color:#fff;margin-top:12px;line-height:1.3;}
.m1 .rule .alw{display:inline-block;margin-top:10px;color:var(--amber);font-weight:900;letter-spacing:.14em;font-size:14px;border:2px solid var(--amber);padding:5px 12px;border-radius:8px;transform:rotate(-3deg);animation:m1Stamp .6s .4s cubic-bezier(.3,1.6,.5,1) both;}

/* ---------- identitet ---------- */
.m1 .orbit{position:relative;width:260px;height:260px;margin:auto;}
.m1 .orbit .core{position:absolute;inset:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#58C3A6,var(--mint));color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.2;padding:12px;box-shadow:0 12px 30px rgba(47,154,125,.35);animation:m1Pop .8s 1.6s both;}
.m1 .orbit .o{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:19px;animation:m1Merge 2.2s cubic-bezier(.5,0,.3,1) both;}
.m1 .orbit .spin{position:absolute;inset:0;animation:m1Spin 26s linear infinite;}

/* ---------- KIT-trekant ---------- */
.m1 .kit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start;margin-top:10px;}
.m1 .kit>div>svg{width:100%;max-width:520px;display:block;margin:auto;overflow:visible;}
.m1 .kit .edge{stroke:#B9CAD7;stroke-width:3;fill:none;stroke-dasharray:1200;stroke-dashoffset:1200;animation:m1Draw 1.6s .2s ease forwards;}
.m1 .kit .face{fill:url(#m1tri);opacity:0;animation:m1Fade .8s 1.2s forwards;}
.m1 .kit .vx{cursor:pointer;}
.m1 .kit .vx .bg{transition:transform .2s;transform-box:fill-box;transform-origin:center;}
.m1 .kit .vx:hover .bg,.m1 .kit .vx:focus .bg{transform:scale(1.08);}
.m1 .kit .vx text{font-family:var(--serif);font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;}
.m1 .kit .vx .seenring{fill:none;stroke:var(--mint);stroke-width:4;opacity:0;}
.m1 .kit .vx.seen .seenring{opacity:1;}
.m1 .kit .vx.act .bg{stroke:var(--amber);stroke-width:6;}
.m1 .kitp{min-height:260px;}
.m1 .kitp .detail{margin-top:0;}
.m1 .kitlbl{font-family:var(--serif);font-size:13px;fill:var(--muted);text-anchor:middle;}

/* ---------- donut ---------- */
.m1 .donut{width:140px;height:140px;flex:none;}
.m1 .donut circle{fill:none;stroke-width:14;}
.m1 .donut .tr{stroke:var(--mist);}
.m1 .donut .val{stroke:var(--ember);stroke-linecap:round;stroke-dasharray:0 252;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray 1.6s cubic-bezier(.3,.8,.3,1);}
.m1 .donut text{font-family:var(--serif);font-weight:700;font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;}
.m1 .statrow{display:flex;gap:22px;align-items:center;}

/* ---------- verdikart ---------- */
.m1 .vk{position:relative;height:620px;margin-top:18px;border-radius:22px;background:radial-gradient(circle at 50% 50%,#FFF8EC 0,#F7FAFC 55%);border:1px solid var(--line);overflow:hidden;}
.m1 .vk svg.lines{position:absolute;inset:0;width:100%;height:100%;}
.m1 .vk svg.lines line{stroke:#C9D6E0;stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;animation:m1Dash 30s linear infinite;}
.m1 .vk svg.lines line.has{stroke:var(--amber);stroke-dasharray:none;}
.m1 .vk-me{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 10px rgba(14,34,51,.06),0 16px 40px rgba(14,34,51,.3);z-index:2;}
.m1 .vk-me b{font-family:var(--serif);font-size:24px;display:block;}
.m1 .vk-me small{font-size:11px;color:var(--mutedl);display:block;}
.m1 .vk-me .cnt{font-size:12px;color:var(--amber);font-weight:800;margin-top:3px;}
.m1 .vk-node{position:absolute;transform:translate(-50%,-50%);width:190px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;z-index:3;transition:border-color .15s,box-shadow .15s,transform .2s;animation:m1Fade .5s both;}
.m1 .vk-node:hover{box-shadow:0 10px 24px rgba(14,34,51,.12);}
.m1 .vk-node.act{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,166,35,.22),0 10px 24px rgba(14,34,51,.12);}
.m1 .vk-node .nh{display:flex;align-items:center;gap:8px;}
.m1 .vk-node .ni{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:#fff;flex:none;}
.m1 .vk-node b{font-size:12.5px;line-height:1.25;flex:1;}
.m1 .vk-node .nc{font-size:11.5px;font-weight:800;min-width:22px;height:22px;border-radius:99px;background:var(--mist);display:grid;place-items:center;padding:0 6px;color:var(--muted);}
.m1 .vk-node.has .nc{background:var(--mint);color:#fff;}
.m1 .vk-node .np{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.m1 .vk-ed{margin-top:16px;border-radius:20px;padding:20px;background:#fff;border:2px solid var(--amber);box-shadow:0 12px 30px rgba(245,166,35,.12);animation:m1Rise .35s both;}
.m1 .vk-add{display:flex;gap:10px;margin-top:10px;}
.m1 .vk-add input{flex:1;}
.m1 .mine{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:36px;}
.m1 .mine .chip{background:var(--navy);color:#fff;animation:m1Pop .3s;}
.m1 .mine .chip button{border:0;background:rgba(255,255,255,.18);color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:10px;padding:0;}
.m1 .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.m1 .sugg button{border:1.5px dashed #C9D6E0;background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--slate);transition:all .15s;}
.m1 .sugg button:hover{border-color:var(--amber);border-style:solid;background:var(--amberS);}
.m1 .sugg button::before{content:"+ ";font-weight:800;color:var(--amberD);}
.m1 .checks{display:grid;gap:8px;margin-top:10px;}
.m1 .checks label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;cursor:pointer;padding:8px 10px;border-radius:10px;}
.m1 .checks label:hover{background:var(--mist);}
.m1 .checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--mint);flex:none;}
.m1 input[type=range]{width:100%;accent-color:var(--amber);}

/* ---------- stjerner / tabell ---------- */
.m1 .stargrp{margin-top:14px;}
.m1 .stargrp h4{font-size:12.5px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.m1 .stargrp h4 i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.m1 .starbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px 7px 10px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:all .15s;}
.m1 .starbtn .i{color:var(--mutedl);font-size:15px;transition:color .15s,transform .3s;}
.m1 .starbtn:hover{border-color:var(--amber);}
.m1 .starbtn.on{background:var(--amberS);border-color:var(--amber);}
.m1 .starbtn.on .i{color:var(--amber);fill:var(--amber);transform:rotate(72deg) scale(1.15);}
.m1 .top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
.m1 .t3{border:2px dashed var(--line);border-radius:16px;padding:16px;min-height:92px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;}
.m1 .t3 .n{font-family:var(--serif);font-size:28px;color:var(--mutedl);line-height:1;}
.m1 .t3.fill{border-style:solid;border-color:var(--amber);background:var(--amberS);animation:m1Pop .35s;}
.m1 .t3.fill .n{color:var(--amberD);}
.m1 .t3 b{font-size:14.5px;}
.m1 .jq{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
.m1 .jq div{border-radius:14px;padding:14px;}
.m1 .jq b{display:block;font-size:14px;margin-bottom:3px;}
.m1 .jq p{font-size:13px;line-height:1.45;color:var(--muted);}
.m1 .row3{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;background:#fff;}
.m1 .row3.ex{background:var(--card);}
.m1 .row3-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.m1 .row3-h .n{width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none;}
.m1 .row3.ex .row3-h .n{background:var(--mist);color:var(--muted);font-size:12px;}
.m1 .row3-h b{font-family:var(--serif);font-size:18px;}
.m1 .cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.m1 .cols4 label.lbl{display:flex;gap:6px;align-items:center;}
.m1 .cols4 .kb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;}
.m1 .cols4 textarea{min-height:92px;font-size:14px;}
.m1 .cols4 .exv{font-size:13.5px;line-height:1.5;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:92px;}

/* ---------- eksport ---------- */
.m1 .sheet{border:1px solid var(--line);border-radius:18px;padding:28px;background:#fff;box-shadow:0 20px 40px rgba(14,34,51,.08);margin-top:18px;position:relative;}
.m1 .sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--amber),var(--ember));border-radius:18px 18px 0 0;}
.m1 .sheet h3{font-size:22px;}
.m1 .sheet h5{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;}
.m1 .sheet p,.m1 .sheet li{font-size:14px;line-height:1.55;}
.m1 .sheet ul{display:grid;gap:4px;}
.m1 .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}

/* ---------- oppsummering (avslør) ---------- */
.m1 .sum{display:grid;gap:12px;margin-top:18px;}
.m1 .sumi{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
.m1 .sumi .n{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;}
.m1 .sumi p{font-size:15.5px;line-height:1.6;padding-top:4px;}
.m1 .blank{display:inline-block;border:0;border-bottom:2px dashed var(--amber);background:var(--amberS);color:transparent;border-radius:6px 6px 0 0;padding:0 6px;cursor:pointer;font:inherit;font-weight:700;position:relative;min-width:90px;}
.m1 .blank::after{content:"trykk";position:absolute;inset:0;color:var(--amberD);font-size:11px;display:grid;place-items:center;letter-spacing:.1em;text-transform:uppercase;font-weight:800;}
.m1 .blank.on{color:var(--ink);background:var(--mintS);border-bottom-color:var(--mint);cursor:default;animation:m1Pop .35s;}
.m1 .blank.on::after{display:none;}

/* ---------- sluttest ---------- */
.m1 .quiz{max-width:720px;margin:18px auto 0;}
.m1 .qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
.m1 .qbar{height:6px;background:var(--mist);border-radius:9px;overflow:hidden;margin-bottom:18px;}
.m1 .qbar i{display:block;height:100%;background:var(--navy);transition:width .4s;}
.m1 .result{text-align:center;padding:10px 0;}
.m1 .result .ring{width:170px;height:170px;margin:0 auto 10px;}
.m1 .result .ring circle{fill:none;stroke-width:12;}
.m1 .result .ring .tr{stroke:var(--mist);}
.m1 .result .ring .val{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray 1.4s cubic-bezier(.3,.8,.3,1);}
.m1 .result .ring text{font-family:var(--serif);font-size:30px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--ink);}
.m1 .review{text-align:left;margin-top:18px;display:grid;gap:8px;}
.m1 .review div{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--card);border-left:4px solid var(--mint);}
.m1 .review div.no{border-left-color:var(--ember);}

/* ---------- fullført ---------- */
.m1 .cert{position:relative;border-radius:24px;padding:40px 36px;background:linear-gradient(145deg,#fff 0,#FFF7E8 100%);border:1px solid #F3D9A8;text-align:center;overflow:hidden;margin-top:10px;}
.m1 .cert::before,.m1 .cert::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(245,166,35,.10);}
.m1 .cert::before{top:-120px;left:-80px;} .m1 .cert::after{bottom:-140px;right:-60px;}
.m1 .medal{width:110px;height:110px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD27A,var(--amber));display:grid;place-items:center;font-size:52px;color:var(--navy);box-shadow:0 0 0 10px rgba(245,166,35,.18),0 18px 40px rgba(245,166,35,.4);animation:m1Pop .8s cubic-bezier(.3,1.6,.5,1) both;position:relative;z-index:1;}
.m1 .cert h1{position:relative;z-index:1;}
.m1 .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;position:relative;z-index:1;}
.m1 .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 10px;}
.m1 .kpi b{display:block;font-family:var(--serif);font-size:30px;line-height:1;}
.m1 .kpi small{font-size:12px;color:var(--muted);}
.m1 .next{display:flex;gap:18px;align-items:center;background:var(--navy);color:#fff;border-radius:20px;padding:22px 24px;margin-top:22px;}
.m1 .next .L{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid var(--amber);display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:700;color:var(--amber);flex:none;}
.m1 .next p{color:#C9D8E3;font-size:14.5px;line-height:1.5;}
.m1 .next b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:2px;}

/* ---------- toast + konfetti ---------- */
.m1-toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 14px 34px rgba(14,34,51,.3);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:60;max-width:calc(100vw - 32px);}
.m1-toast.on{opacity:1;transform:translate(-50%,0);}
.m1-toast .i{color:var(--amber);font-size:18px;}
.m1-confetti{position:fixed;inset:0;pointer-events:none;z-index:70;}

/* ---------- inngangsanimasjon ---------- */
.m1 .rv{animation:m1Rise .6s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--d,0) * 90ms);}
.m1-stage.enter{animation:m1Fade .35s both;}

@keyframes m1Rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@keyframes m1Fade{from{opacity:0;}to{opacity:1;}}
@keyframes m1Pop{0%{transform:scale(.7);opacity:0;}70%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}
@keyframes m1Shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes m1Pulse{0%{transform:scale(1);opacity:.9;}100%{transform:scale(1.7);opacity:0;}}
@keyframes m1Spin{to{transform:rotate(360deg);}}
@keyframes m1Draw{to{stroke-dashoffset:0;}}
@keyframes m1Dash{to{stroke-dashoffset:-200;}}
@keyframes m1Shine{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
@keyframes m1Nudge{0%,100%{transform:none;}30%{transform:translateX(5px);}60%{transform:translateX(-2px);}}
@keyframes m1Deal{from{opacity:0;transform:translateY(24px) rotate(-2deg) scale(.96);}to{opacity:1;transform:none;}}
@keyframes m1Stamp{from{opacity:0;transform:rotate(8deg) scale(2);}to{opacity:1;}}
@keyframes m1Flash{0%,100%{border-color:var(--line);}50%{border-color:var(--ember);background:var(--emberS);}}
@keyframes m1Merge{0%{transform:rotate(var(--a)) translate(118px) rotate(calc(var(--a) * -1)) scale(1);opacity:0;}20%{opacity:1;}60%{transform:rotate(calc(var(--a) + 120deg)) translate(118px) rotate(calc((var(--a) + 120deg) * -1)) scale(1);opacity:1;}100%{transform:rotate(calc(var(--a) + 180deg)) translate(104px) rotate(calc((var(--a) + 180deg) * -1)) scale(.8);opacity:1;}}

@media (prefers-reduced-motion:reduce){
  .m1 *,.m1 *::before,.m1 *::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;}
}

/* ---------- responsivt ---------- */
@media (max-width:1080px){
  .m1-layout{grid-template-columns:1fr;padding:16px;}
  .m1-side{position:fixed;top:0;left:0;bottom:0;width:300px;max-height:none;border-radius:0 18px 18px 0;z-index:55;transform:translateX(-105%);transition:transform .3s;}
  .m1.open .m1-side{transform:none;}
  .m1.open .m1-scrim{display:block;position:fixed;inset:0;background:rgba(14,34,51,.4);z-index:50;}
  .m1-menu{display:grid;}
  .m1-stage{padding:32px 28px 24px;}
  .m1-foot{padding:14px 28px;}
}
@media (max-width:820px){
  .m1 .g3,.m1 .g4,.m1 .tiles,.m1 .habits,.m1 .frames,.m1 .slots,.m1 .jq,.m1 .top3{grid-template-columns:1fr 1fr;}
  .m1 .hero,.m1 .kit,.m1 .g2{grid-template-columns:1fr;}
  .m1 .cols4{grid-template-columns:1fr 1fr;}
  .m1 .kpis{grid-template-columns:1fr 1fr;}
  .m1 .vk{height:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);}
  .m1 .vk svg.lines{display:none;}
  .m1 .vk-me{position:static;transform:none;width:auto;height:auto;border-radius:16px;padding:14px;grid-column:1/-1;}
  .m1 .vk-node{position:static;transform:none;width:auto;}
}
@media (max-width:560px){
  .m1-top-in{padding:10px 16px;gap:10px;}
  .m1-brand>div,.m1-pill span{display:none;}
  .m1-layout{padding:0;}
  .m1-main{border-radius:0;box-shadow:none;}
  .m1-foot{border-radius:0;}
  .m1-stage{padding:26px 16px 20px;}
  .m1-foot{padding:12px 16px;}
  .m1-foot .hint{font-size:12px;}
  .m1-foot .btn{padding:10px 14px;}
  .m1 .g3,.m1 .g4,.m1 .tiles,.m1 .habits,.m1 .frames,.m1 .slots,.m1 .jq,.m1 .top3,.m1 .cols4,.m1 .twoq,.m1 .reveal{grid-template-columns:1fr;}
  .m1 .dchoices.c3{grid-template-columns:1fr;}
  .m1 .pair{grid-template-columns:1fr;}
  .m1 .pair .arr{transform:rotate(90deg);justify-self:center;}
  .m1 .dual-row{grid-template-columns:1fr;gap:6px;}
  .m1 .vk{grid-template-columns:1fr;}
  .m1 .statrow{flex-direction:column;align-items:flex-start;}
  .m1 .next{flex-direction:column;align-items:flex-start;}
  .m1 .dcard{padding:22px 18px;}
  .m1 .callout{padding:16px 16px 16px 50px;}
  .m1 .callout>.ci{left:14px;top:16px;}
}

/* ---------- utskrift: bare planarket ---------- */
.m1-print{display:none;}
@media print{
  body *{visibility:hidden!important;}
  .m1-print,.m1-print *{visibility:visible!important;}
  .m1-print{display:block!important;position:absolute;left:0;top:0;width:100%;padding:0 10mm;font-family:Georgia,serif;color:#111;}
  .m1-print h1{font-size:22pt;margin:0 0 4pt;}
  .m1-print h2{font-size:13pt;margin:14pt 0 4pt;border-bottom:1px solid #999;padding-bottom:2pt;}
  .m1-print p,.m1-print li,.m1-print td,.m1-print th{font-size:10.5pt;line-height:1.45;font-family:Arial,sans-serif;}
  .m1-print table{width:100%;border-collapse:collapse;margin-top:6pt;}
  .m1-print td,.m1-print th{border:1px solid #999;padding:5pt;vertical-align:top;text-align:left;}
}
</style>

</div>
<div class="m1-print" id="m1-print"></div>

<script>
(function(){
'use strict';

/* =========================================================

var ICONS={

function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* =========================================================
   Tilstand (lagres lokalt)
   ========================================================= */
var KEY='sk101-modul1-v1';
function fresh(){return {cur:0,done:{},pts:0,got:{},r1:'',r2:{cat:'',note:''},map:{},checks:{},guess:40,stars:[],table:{},quizBest:null,finished:null};}
var S=fresh();
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o){if(Object.prototype.hasOwnProperty.call(S,k))S[k]=o[k];}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* =========================================================
   Kategorier (brukes i flere leksjoner)
   ========================================================= */
var CATS=[
  {id:'kontoer',name:'Kontoer og innlogginger',short:'Kontoer',icon:'key',color:'#2F74B5',hint:'e-post · sosiale medier · Feide/jobbkonto · spill',

function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[0];}
function mapItems(id){return (S.map[id]=S.map[id]||[]);}
function allItems(){var r=[];CATS.forEach(function(c){mapItems(c.id).forEach(function(t){r.push({cat:c.id,t:t});});});return r;}
function itemCount(){return allItems().length;}

/* =========================================================
   Gjenbrukbare interaktive komponenter
   ========================================================= */

/* Flervalg: prøv til riktig svar er funnet */
function mcq(el,o){
  var L='ABCDEFG',tries=0,solved=false;
  el.innerHTML=(o.q?'<p class="q">'+o.q+'</p>':'')+'<div class="opts">'+o.options.map(function(op,i){
    return '<button class="opt" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+op.t+'</span></button>';}).join('')+'</div><div class="fb" aria-live="polite"></div>';
  var fb=$('.fb',el);
  if(o.solved){solveUI();return;}
  $$('.opt',el).forEach(function(b){b.addEventListener('click',function(){
    if(solved)return;var op=o.options[+b.dataset.i];tries++;
    if(op.ok){solved=true;solveUI(b);if(tries===1&&o.key)award(o.key,5);if(o.onCorrect)o.onCorrect(tries);}
    else{b.classList.add('no');b.disabled=true;fb.className='fb show bad';fb.innerHTML='<b>Ikke helt.</b> '+(op.fb||'Prøv igjen.');}
  });});
  function solveUI(btn){
    var idx=o.options.findIndex(function(x){return x.ok;});
    btn=btn||$$('.opt',el)[idx];btn.classList.add('ok');
    $$('.opt',el).forEach(function(x){x.disabled=true;});
    var op=o.options[idx];fb.className='fb show good';fb.innerHTML='<b>Riktig!</b> '+(op.fb||'');
  }
}

/* Sorteringsspill: klikk (eller dra) et element til riktig bås */
function sortGame(el,o){
  var items=shuffle(o.items),done=o.solved,wrong={},sel=null,left=items.length;
  el.innerHTML='<p class="small muted" style="margin-bottom:10px">'+ic('hand')+' Trykk på et kort og deretter på riktig bås – eller dra kortet dit.</p>'+
    '<div class="pool" role="list"></div><div class="sortfb" aria-live="polite"></div>'+
    '<div class="bins" style="grid-template-columns:repeat('+(o.cols||o.bins.length)+',minmax(0,1fr))">'+o.bins.map(function(b){

/* Kortstokk: ett scenario om gangen, svar med store knapper */
function deck(el,o){
  var i=0,score=0,res=[];
  function pips(){return '<div class="pips">'+o.cards.map(function(c,k){return '<i class="'+(res[k]===true?'ok':res[k]===false?'no':k===i?'on':'')+'"></i>';}).join('')+'</div>';}
  function show(){
    if(i>=o.cards.length){return summary();}
    var c=o.cards[i];
    el.innerHTML='<div class="deck"><div class="deck-top"><span>Kort '+(i+1)+' av '+o.cards.length+'</span>'+pips()+'</div>'+
      '<div class="dcard"><div class="sit-ico">'+ic(c.icon||'eye')+'</div><p class="sit">'+c.t+'</p>'+
      '<div class="dchoices c'+o.choices.length+'">'+o.choices.map(function(ch){return '<button class="dbtn" data-c="'+ch.id+'">'+ch.label+(ch.sub?'<small>'+ch.sub+'</small>':'')+'</button>';}).join('')+'</div>'+
      '<div class="fb"></div><div class="actions" style="justify-content:flex-end;display:none"><button class="btn btn-d btn-sm nx">'+(i===o.cards.length-1?'Se resultatet':'Neste kort')+' '+ic('right')+'</button></div></div></div>';
    $$('.dbtn',el).forEach(function(b){b.addEventListener('click',function(){
      var ok=b.dataset.c===c.a;res[i]=ok;if(ok){score++;if(o.key)award(o.key+':'+i,3);}
      $$('.dbtn',el).forEach(function(x){x.disabled=true;if(x.dataset.c===c.a)x.classList.add('ok');});
      if(!ok)b.classList.add('no');
      var card=$('.dcard',el);card.insertAdjacentHTML('beforeend','<span class="stamp '+(ok?'ok':'no')+'">'+(ok?'RIKTIG':'FEIL')+'</span>');
      var fb=$('.fb',el);fb.className='fb show '+(ok?'good':'bad');fb.innerHTML=c.why;
      $('.deck-top .pips',el).outerHTML=pips();
      var a=$('.actions',el);a.style.display='flex';var nx=$('.nx',el);nx.focus();nx.addEventListener('click',function(){i++;show();});
    });});
  }
  function summary(){
    var n=o.cards.length;
    el.innerHTML='<div class="deck"><div class="dcard dsum"><div class="big">'+score+' / '+n+'</div><p class="muted" style="margin:6px 0 16px">'+(score===n?'Perfekt! ':score>=n-2?'Godt jobbet! ':'Bra forsøk! ')+(o.sumText||'')+'</p>'+
      '<button class="btn btn-s btn-sm again">'+ic('refresh')+' Ta runden på nytt</button></div></div>';
    $('.again',el).addEventListener('click',function(){i=0;score=0;res=[];show();});
    if(o.onDone)o.onDone(score);
  }
  if(o.solved&&o.showSolvedSummary!==false){el.innerHTML='<div class="deck"><div class="dcard dsum"><div class="big">'+ic('check')+'</div><p class="muted" style="margin:6px 0 16px">Du har fullført denne runden.</p><button class="btn btn-s btn-sm again">'+ic('refresh')+' Ta runden på nytt</button></div></div>';$('.again',el).addEventListener('click',show);}
  else show();
}

/* Tall som teller opp */
function countUp(root){
  $$('[data-count]',root).forEach(function(n){
    if(n._c)return;n._c=1;var to=parseFloat(n.dataset.count),dec=(n.dataset.dec|0),suf=n.dataset.suf||'',t0=null,dur=1500;
    function f(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur);p=1-Math.pow(1-p,3);
      var v=to*p;n.textContent=v.toLocaleString('nb-NO',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(p<1)requestAnimationFrame(f);}
    requestAnimationFrame(f);
  });
}

function bindText(el,get,set,after){

}

L.push({id:'l113',sec:'1.1 Hva er cybersikkerhet i praksis?',title:'Saras dag: seks feller',icon:'clock',gate:true,

mount:function(r,ctx){
  var n=ctx.done?6:0;
  function upd(){
    $$('.ev',r).forEach(function(ev,i){ev.classList.toggle('fin',i<n);ev.classList.toggle('act',i===n);ev.classList.toggle('lock',i>n);});
    $('#saracnt',r).textContent=n+'/6';
    var tl=$('#tl',r),evs=$$('.ev',r),last=evs[Math.min(n,5)];
    $('#tlf',r).style.height=Math.max(0,(last.offsetTop+24))+'px';
    if(n===6)$('#saraend',r).style.display='block';
  }
  function solved(i){
    var e=SARA[i],ev=$$('.ev',r)[i];
    $('.evr',ev).innerHTML='<div class="reveal"><div class="trap"><small>Fellen</small>'+e.trap+' · '+e.mod+'</div><div class="val"><small>Verdien som angripes</small>'+e.val+'</div></div>';
  }
  SARA.forEach(function(e,i){
    var ev=$$('.ev',r)[i];
    mcq($('.evq',ev),{options:e.o,key:'sara'+i,solved:i<n,onCorrect:function(){solved(i);n=Math.max(n,i+1);upd();
      if(n<6){setTimeout(function(){var nx=$$('.ev',r)[n];if(nx)nx.scrollIntoView({behavior:'smooth',block:'center'});},500);}
      else ctx.complete();}});

  });
  requestAnimationFrame(upd);
}});

L.push({id:'vk1',sec:'1.4 Praktisk oppgave: Ditt digitale verdikart',title:'Steg 1: Lag verdikartet',icon:'map',gate:true,

   '<div class="card"><h3>'+ic('key')+' Hvor mange kontoer tror du at du har?</h3><div class="stat" id="gv" style="margin:14px 0 6px">40</div><input type="range" id="guess" min="0" max="150" step="1" aria-label="Antall kontoer"><p style="margin-top:10px">Mange ender med <b>40–100 kontoer</b>. Det er ikke unormalt – og nettopp derfor du trenger passordbehandleren du lærer om i modul 3.</p></div>'+
  '</div><p class="small muted" id="vkst" style="margin-top:14px"></p>';

mount:function(r,ctx){
  var act=null,vk=$('#vk',r);
  function pos(k){var a=(-90+k*360/7)*Math.PI/180;return [50+37*Math.cos(a),50+39*Math.sin(a)];}
  function draw(){
    var tot=itemCount();
    vk.innerHTML='<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+CATS.map(function(c,k){var p=pos(k);return '<line x1="50" y1="50" x2="'+p[0]+'" y2="'+p[1]+'" class="'+(mapItems(c.id).length?'has':'')+'"/>';}).join('')+'</svg>'+
      '<div class="vk-me"><div><b>MEG</b><small>min digitale hverdag</small><div class="cnt">'+tot+' verdier</div></div></div>'+
      CATS.map(function(c,k){var p=pos(k),it=mapItems(c.id);return '<button class="vk-node'+(it.length?' has':'')+(act===c.id?' act':'')+'" data-c="'+c.id+'" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:'+(k*60)+'ms"><div class="nh"><span class="ni" style="background:'+c.color+'">'+ic(c.icon)+'</span><b>'+c.name+'</b><span class="nc">'+it.length+'</span></div><div class="np">'+(it.length?it.map(h).join(' · '):c.hint)+'</div></button>';}).join('');
    $$('.vk-node',vk).forEach(function(b){b.addEventListener('click',function(){act=b.dataset.c;draw();editor();});});
    var filled=CATS.filter(function(c){return mapItems(c.id).length>0;}).length;
    $('#vkst',r).innerHTML=(filled===7?ic('check')+' Alle sju grener har minst én verdi. Fortsett gjerne å fylle ut – eller gå videre.':'Fyll ut minst én verdi i hver av de sju grenene for å gå videre ('+filled+'/7).');
    if(filled===7)ctx.complete();
  }
  function editor(){
    var ed=$('#ed',r);if(!act){ed.innerHTML='';return;}
    var c=cat(act),it=mapItems(act);
    ed.innerHTML='<div class="vk-ed"><div class="detail-h"><span class="ti" style="background:'+c.color+';width:40px;height:40px;font-size:20px;border-radius:12px">'+ic(c.icon)+'</span><div><h3 style="margin:0">'+c.name+'</h3><span class="small muted">'+c.hint+'</span></div><button class="btn btn-s btn-sm" id="cl" style="margin-left:auto">Lukk</button></div>'+
      '<div class="vk-add"><input type="text" id="ni" maxlength="80" placeholder="Skriv en verdi og trykk Enter …" aria-label="Ny verdi i '+h(c.name)+'"><button class="btn btn-d btn-sm" id="ad">Legg til</button></div>'+
      '<div class="mine">'+(it.length?it.map(function(t,i){return '<span class="chip">'+h(t)+'<button data-i="'+i+'" aria-label="Fjern '+h(t)+'">'+ic('x')+'</button></span>';}).join(''):'<span class="small muted">Ingen verdier ennå.</span>')+'</div>'+
      '<p class="small muted" style="margin-top:12px;font-weight:700">Forslag – trykk for å legge til:</p><div class="sugg">'+c.sugg.filter(function(s){return it.indexOf(s)<0;}).map(function(s){return '<button>'+h(s)+'</button>';}).join('')+'</div></div>';
    var inp=$('#ni',ed);
    function add(v){v=(v||'').trim();if(!v)return;if(it.indexOf(v)<0){it.push(v);save();}draw();editor();var n=$('#ni',r);if(n)n.focus();}
    $('#ad',ed).addEventListener('click',function(){add(inp.value);});
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add(inp.value);}});
    $$('.sugg button',ed).forEach(function(b){b.addEventListener('click',function(){add(b.textContent);});});
    $$('.mine button',ed).forEach(function(b){b.addEventListener('click',function(){var t=it[+b.dataset.i];it.splice(+b.dataset.i,1);S.stars=S.stars.filter(function(s){return !(s.cat===act&&s.t===t);});save();draw();editor();});});
    $('#cl',ed).addEventListener('click',function(){act=null;draw();editor();});
  }
  draw();
  $$('.checks input',r).forEach(function(c){c.checked=!!S.checks[c.dataset.k];c.addEventListener('change',function(){S.checks[c.dataset.k]=c.checked;save();});});
  var g=$('#guess',r),gv=$('#gv',r);g.value=S.guess;gv.textContent=S.guess;
  g.addEventListener('input',function(){S.guess=+g.value;gv.textContent=g.value+(g.value>=150?'+':'');save();});
}});

L.push({id:'vk2',sec:'1.4 Praktisk oppgave: Ditt digitale verdikart',title:'Steg 2: Velg dine tre viktigste',icon:'star',gate:true,
html:function(){
  return '<div class="eyebrow rv"><span class="n">1.4.2</span> Praktisk oppgave · Steg 2 av 3</div>'+
  '<h1 class="t rv" style="--d:1">Velg dine tre viktigste digitale verdier</h1>'+
  '<p class="lede rv" style="--d:2">Bruk de tre kronjuvel-spørsmålene – <b>nøkler, uerstattelig, ansvar</b> – og sett en stjerne ved dine tre mest verdifulle verdier. Vær streng: <b>bare tre</b>.</p>'+
  '<div class="top3 rv" style="--d:3" id="t3"></div>'+
  '<div class="rv" style="--d:4" id="sl"></div>'+
  '<details class="card rv" style="--d:5;margin-top:22px"><summary style="cursor:pointer;font-weight:700">'+ic('users')+' Hva velger mange andre i Norge?</summary><ol style="margin-top:10px;display:grid;gap:6px;font-size:14.5px;list-style:decimal;padding-left:20px"><li>E-postkontoen din (hoveddøren til alt)</li><li>BankID og nettbank (penger og juridisk identitet)</li><li>Mobiltelefonen (beholderen som åpner alt annet), bildearkivet eller jobbkontoen</li></ol><p class="small muted" style="margin-top:8px">Din liste kan være annerledes – og det er hele poenget.</p></details>';
},
mount:function(r,ctx){
  function isStar(c,t){return S.stars.some(function(s){return s.cat===c&&s.t===t;});}
  function draw(){
    S.stars=S.stars.filter(function(s){return mapItems(s.cat).indexOf(s.t)>=0;});
    $('#t3',r).innerHTML=[0,1,2].map(function(i){var s=S.stars[i];return s?'<div class="t3 fill"><span class="n">'+ic('star')+'</span><b>'+h(s.t)+'</b><span class="small muted">'+h(cat(s.cat).short)+'</span></div>':'<div class="t3"><span class="n">'+(i+1)+'</span><span class="small muted">Velg en verdi</span></div>';}).join('');
    var grp=CATS.filter(function(c){return mapItems(c.id).length;});
    $('#sl',r).innerHTML=grp.length?grp.map(function(c){return '<div class="stargrp"><h4><i style="background:'+c.color+'"></i>'+c.name+'</h4><div class="chips">'+mapItems(c.id).map(function(t){return '<button class="starbtn'+(isStar(c.id,t)?' on':'')+'" data-c="'+c.id+'" data-t="'+h(t)+'" aria-pressed="'+isStar(c.id,t)+'">'+ic('star')+h(t)+'</button>';}).join('')+'</div></div>';}).join(''):'<div class="callout c-warn"><span class="ci">'+ic('alert')+'</span><p>Verdikartet ditt er tomt. Gå tilbake til steg 1 og fyll det ut først.</p></div>';
    $$('.starbtn',r).forEach(function(b){b.addEventListener('click',function(){
      var c=b.dataset.c,t=b.dataset.t;
      if(isStar(c,t))S.stars=S.stars.filter(function(s){return !(s.cat===c&&s.t===t);});
      else{if(S.stars.length>=3){toast('Vær streng: bare tre! Fjern en stjerne først.','star');return;}S.stars.push({cat:c,t:t});}
      save();draw();
    });});
    if(S.stars.length===3)ctx.complete();else ctx.uncomplete();
  }
  draw();
}});

/* ---------- Lever/arkiver ---------- */
function planData(){
  return {r1:S.r1,r2:S.r2.cat?cat(S.r2.cat).name:'',r2n:S.r2.note,
    map:CATS.map(function(c){return {name:c.name,items:mapItems(c.id).slice()};}),
    stars:S.stars.map(function(s){var t=S.table[s.cat+'|'+s.t]||{};return {t:s.t,cat:cat(s.cat).name,k:t.k||'',i:t.i||'',tt:t.t||'',w:t.w||''};}),
    date:new Date().toLocaleDateString('nb-NO',{day:'numeric',month:'long',year:'numeric'})};
}
function planText(){
  var d=planData(),o=[];
  o.push('MIN SIKRE-PLAN');o.push('Kapittel 1: S – Se hva som skal beskyttes');o.push('Cybersecurity 101 · '+d.date);o.push('');
  o.push('REFLEKSJON');o.push('Det verste som kunne skjedd meg digitalt, er at '+(d.r1||'…'));
  if(d.r2)o.push('Kategorien jeg hadde tenkt minst på: '+d.r2+(d.r2n?' – '+d.r2n:''));o.push('');
  o.push('MITT DIGITALE VERDIKART ('+itemCount()+' verdier)');
  d.map.forEach(function(m){o.push('• '+m.name+': '+(m.items.length?m.items.join(', '):'–'));});o.push('');
  o.push('MINE TRE KRONJUVELER');
  d.stars.forEach(function(s,i){o.push((i+1)+'. '+s.t+' ('+s.cat+')');o.push('   K – hvis noen andre får tilgang: '+s.k);o.push('   I – hvis den endres/forfalskes: '+s.i);o.push('   T – hvis den blir utilgjengelig: '+s.tt);o.push('   Hvem rammes i tillegg til meg: '+s.w);});
  o.push('');o.push('Neste steg: I modul 2 legger du trusler oppå kartet, i modul 3 velger du tiltak for de mest kritiske verdiene, og i modul 5 settes alt sammen i «Min SIKRE-plan».');
  return o.join('\n');
}
function planHTML(){
  var d=planData();
  return '<h3>Min SIKRE-plan</h3><p class="muted small">Kapittel 1: S – Se hva som skal beskyttes · '+h(d.date)+'</p>'+
   '<h5>Refleksjon</h5><p>«Det verste som kunne skjedd meg digitalt, er at '+h(d.r1||'…')+'»</p>'+(d.r2?'<p class="small muted" style="margin-top:4px">Minst tenkt på: <b>'+h(d.r2)+'</b>'+(d.r2n?' – '+h(d.r2n):'')+'</p>':'')+
   '<h5>Mitt digitale verdikart · '+itemCount()+' verdier</h5><ul>'+d.map.map(function(m){return '<li><b>'+h(m.name)+':</b> '+(m.items.length?m.items.map(h).join(', '):'–')+'</li>';}).join('')+'</ul>'+
   '<h5>Mine tre kronjuveler</h5>'+d.stars.map(function(s,i){return '<div style="margin-top:10px"><p><b>'+(i+1)+'. '+h(s.t)+'</b> <span class="small muted">('+h(s.cat)+')</span></p><ul style="margin-top:4px;padding-left:12px"><li><b>K:</b> '+h(s.k)+'</li><li><b>I:</b> '+h(s.i)+'</li><li><b>T:</b> '+h(s.tt)+'</li><li><b>Rammer også:</b> '+h(s.w)+'</li></ul></div>';}).join('');
}
function planPrint(){
  var d=planData();
  return '<h1>Min SIKRE-plan</h1><p>Kapittel 1: S – Se hva som skal beskyttes · Cybersecurity 101 · '+h(d.date)+'</p>'+
   '<h2>Refleksjon</h2><p>«Det verste som kunne skjedd meg digitalt, er at '+h(d.r1||'…')+'»</p>'+(d.r2?'<p>Kategorien jeg hadde tenkt minst på: '+h(d.r2)+(d.r2n?' – '+h(d.r2n):'')+'</p>':'')+
   '<h2>Mitt digitale verdikart ('+itemCount()+' verdier)</h2><table>'+d.map.map(function(m){return '<tr><th style="width:32%">'+h(m.name)+'</th><td>'+(m.items.length?m.items.map(h).join(', '):'–')+'</td></tr>';}).join('')+'</table>'+
   '<h2>Mine tre kronjuveler</h2><table><tr><th>Min verdi</th><th>Hvis noen andre får tilgang (K)</th><th>Hvis den endres/forfalskes (I)</th><th>Hvis den blir utilgjengelig (T)</th><th>Hvem rammes i tillegg til meg?</th></tr>'+
   d.stars.map(function(s,i){return '<tr><td><b>'+(i+1)+'. '+h(s.t)+'</b></td><td>'+h(s.k)+'</td><td>'+h(s.i)+'</td><td>'+h(s.tt)+'</td><td>'+h(s.w)+'</td></tr>';}).join('')+'</table>'+
   '<p style="margin-top:14pt"><i>I modul 2 legger du trusler oppå kartet, i modul 3 velger du tiltak for de mest kritiske verdiene, og i modul 5 settes alt sammen i «Min SIKRE-plan».</i></p>';
}
