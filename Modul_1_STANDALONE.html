    'Profesjonelt sikkerhetsarbeid, fra NSM til NIST, starter med å [kjenne verdiene sine]. Nå gjør du det også.',
    'Dine digitale verdier faller i seks kategorier – kontoer, e-post/meldinger, filer, enheter, sky/apper og BankID/betaling – pluss den usynlige sjuende: [identiteten og omdømmet ditt].',
    'Beskyttelse har tre mål (KIT): at ingen uvedkommende får tilgang ([Konfidensialitet]), at ingenting forfalskes ([Integritet]), og at alt virker når du trenger det ([Tilgjengelighet]).',
    'De viktigste verdiene finner du med tre spørsmål: Hva [åpner alt annet]? Hva kan ikke [erstattes]? Hva kan [skade andre]?',
    'Den absolutte regelen: Ingen legitim aktør som kontakter deg, ber deg noensinne om [BankID-koder, passord eller engangskoder].'
  ];
  var n=0;
  return '<div class="eyebrow rv"><span class="n">1.5</span> Oppsummering</div>'+
  '<h1 class="t rv" style="--d:1">Det viktigste fra modul 1</h1>'+
  '<p class="lede rv" style="--d:2">Aktiv gjenkalling: Tenk på hva som skjuler seg bak hvert felt <i>før</i> du trykker på det.</p>'+
  '<div class="sum">'+P.map(function(p,k){return '<div class="sumi rv" style="--d:'+(3+k)+'"><span class="n">'+(k+1)+'</span><p>'+p.replace(/\[([^\]]+)\]/g,function(m,t){n++;return '<button class="blank" aria-label="Vis skjult ord">'+t+'</button>';})+'</p></div>';}).join('')+'</div>'+
  '<p class="small muted" id="bc" style="margin-top:12px"></p>';
},
mount:function(r,ctx){
  var bl=$$('.blank',r);
  function cnt(){var on=bl.filter(function(b){return b.classList.contains('on');}).length;$('#bc',r).textContent=on+' av '+bl.length+' felt avslørt';if(on===bl.length)ctx.complete();}
  bl.forEach(function(b){if(ctx.done){b.classList.add('on');b.removeAttribute('aria-label');}
    b.addEventListener('click',function(){if(b.classList.contains('on'))return;b.classList.add('on');b.removeAttribute('aria-label');cnt();});});
  cnt();
}});

/* ---------- Sluttest ---------- */
var QUIZ=[
  {q:'Hvor starter godt sikkerhetsarbeid ifølge både NSM, NIST og SIKRE-modellen?',o:['Med å kjenne verdiene man har','Med å kjøpe gode sikkerhetsverktøy','Med å installere antivirus','Med å lære seg programmering'],why:'«Kjenn dine verdier» kommer først – før man reduserer sårbarheter og bygger reserveløsninger.'},
  {q:'Hvorfor kalles e-postkontoen ofte «nøkkelen til kongeriket»?',o:['Fordi lenker for å nullstille passord sendes dit','Fordi den er dyrest å kjøpe','Fordi den alltid er kryptert','Fordi den inneholder BankID'],why:'Den som kontrollerer e-posten din, kan nullstille og overta nesten alle andre kontoer.'},
  {q:'«Banken» ringer og ber deg godkjenne i BankID-appen mens dere snakker. Hva er riktig?',o:['Legge på – dette er svindel, alltid','Godkjenne hvis nummeret ser riktig ut','Godkjenne hvis de kan kontonummeret ditt','Be dem sende en SMS først, og så godkjenne'],why:'Ingen seriøs aktør ber deg godkjenne mens de er på telefon. Den som ber om det, er en svindler.'},
  {q:'Noen endrer i det stille kontonummeret på en faktura du skal betale. Hvilket KIT-mål er brutt?',o:['Integritet','Konfidensialitet','Tilgjengelighet','Ingen av dem'],why:'Informasjonen er endret – fakturasvindel er et klassisk integritetsbrudd.'},
  {q:'Et løsepengevirus låser filene dine uten å lese dem. Hvilket mål rammes først og fremst?',o:['Tilgjengelighet','Konfidensialitet','Integritet','Autentisitet'],why:'Filene er der, men du får ikke brukt dem.'},
  {q:'Hva er den sjuende, «usynlige» kategorien av digitale verdier?',o:['Identiteten og omdømmet ditt','Passordbehandleren','Hjemmeruteren','Strømmeabonnementene'],why:'Den er summen av de seks andre – og tar lengst tid å bygge opp igjen.'},
  {q:'Du har tilgang til pasientdata på jobb. Hvilket kronjuvel-spørsmål passer best?',o:['Hva kan skade andre enn meg?','Hva gir tilgang til alt annet?','Hva kan ikke erstattes?','Ingen – det er arbeidsgiverens ansvar'],why:'Dette forvalter du på vegne av andre – her møtes ditt ansvar og arbeidsplassens.'},
  {q:'Hva er den største trusselen mot bildearkivet ditt?',o:['Tap – for eksempel løsepengevirus eller mistet telefon','At svindlere vil stjele bildene','At bildene blir redigert','At bildene tar for stor plass'],why:'Uerstattelige filer trues først og fremst av tap – derfor trenger de sikkerhetskopi.'},
  {q:'Hvorfor er gamle, glemte kontoer en risiko?',o:['Gjenbrukte passord kan bli en bakdør inn til de nye kontoene','De sletter seg selv etter en tid','De er alltid uten passord','De koster penger'],why:'Gamle nettbutikk-, spill- og forumkontoer med gjenbrukte passord er en vanlig bakdør.'},
  {q:'Hvorfor er «Jeg har jo ingenting å skjule» et dårlig argument?',o:['Du har noe å miste selv om du ikke har noe å skjule','Fordi alle har noe å skjule','Fordi loven krever at man skjuler ting','Det er et godt argument'],why:'Identitet, omdømme, penger og andres tillit kan gå tapt – uansett hva du har å skjule.'},
  {q:'Hvilke enheter skal med i verdikartet ditt?',o:['Alt som kobler seg til internett – også smartklokke, ruter og gammel mobil','Bare mobilen og PC-en','Bare enheter du har kjøpt selv','Bare enheter med BankID'],why:'«Usynlige» enheter som ruteren og den gamle mobilen i skuffen teller også.'},
  {q:'Sara får tre varsler om «ny innlogging» som hun ikke har bedt om. Hva bør hun gjøre?',o:['Avvise, bytte passord og sjekke kontoen','Godkjenne for å få fred','Vente og se om det gir seg','Slå av varsler på telefonen'],why:'Noen har passordet hennes og prøver å slite henne ut (MFA-utmattelse).'}
];
var PASS=0.8,QN=10;
L.push({id:'quiz',sec:'1.5 Oppsummering og sluttest',title:'Sluttest',icon:'trophy',gate:true,
html:function(){
  return '<div class="eyebrow rv"><span class="n">Sluttest</span> Modul 1</div>'+
  '<h1 class="t rv" style="--d:1">Vis hva du kan</h1>'+
  '<p class="lede rv" style="--d:2">'+QN+' spørsmål fra hele modulen. Du trenger minst <b>'+Math.ceil(QN*PASS)+' riktige</b> for å fullføre. Du får forklaring etter hvert svar, og kan ta testen så mange ganger du vil.</p>'+
  (S.quizBest!=null?'<p class="chip rv" style="--d:3;margin-top:12px">'+ic('trophy')+' Beste resultat så langt: '+S.quizBest+' / '+QN+'</p>':'')+
  '<div id="qz" class="rv" style="--d:3"></div>';
},
mount:function(r,ctx){
  var el=$('#qz',r),qs,i,score,log;
  function start(){
    qs=shuffle(QUIZ).slice(0,QN).map(function(q){return {q:q.q,why:q.why,o:shuffle(q.o.map(function(t,k){return {t:t,ok:k===0};}))};});
    i=0;score=0;log=[];show();
  }
  function intro(){
    el.innerHTML='<div class="quiz"><div class="dcard" style="text-align:center"><div class="ico" style="margin:0 auto 12px;width:64px;height:64px;font-size:30px">'+ic('trophy')+'</div><h3>Klar?</h3><p class="muted" style="margin:6px 0 16px">Ta deg god tid. Les alle alternativene før du svarer.</p><button class="btn btn-p" id="go">'+ic('play')+' Start sluttesten</button></div></div>';
    $('#go',el).addEventListener('click',start);
  }
  function show(){
    var q=qs[i],Lt='ABCD';
    el.innerHTML='<div class="quiz"><div class="qhead"><span>Spørsmål '+(i+1)+' av '+QN+'</span><span>'+ic('check')+' '+score+' riktige</span></div><div class="qbar"><i style="width:'+(i/QN*100)+'%"></i></div>'+
      '<div class="dcard"><p class="q" style="font-family:var(--serif);font-size:20px;font-weight:700">'+q.q+'</p><div class="opts">'+q.o.map(function(o,k){return '<button class="opt" data-k="'+k+'"><span class="k">'+Lt[k]+'</span><span>'+o.t+'</span></button>';}).join('')+'</div><div class="fb"></div><div class="actions" style="justify-content:flex-end;display:none"><button class="btn btn-d btn-sm" id="nq">'+(i===QN-1?'Se resultatet':'Neste spørsmål')+' '+ic('right')+'</button></div></div></div>';
    $$('.opt',el).forEach(function(b){b.addEventListener('click',function(){
      var o=q.o[+b.dataset.k];if(o.ok)score++;log.push({q:q.q,ok:o.ok,why:q.why});
      $$('.opt',el).forEach(function(x){x.disabled=true;if(q.o[+x.dataset.k].ok)x.classList.add('ok');});if(!o.ok)b.classList.add('no');
      var fb=$('.fb',el);fb.className='fb show '+(o.ok?'good':'bad');fb.innerHTML='<b>'+(o.ok?'Riktig!':'Ikke riktig.')+'</b> '+q.why;
      $('.actions',el).style.display='flex';var nq=$('#nq',el);nq.focus();nq.addEventListener('click',function(){i++;if(i<QN)show();else result();});
    });});
  }
  function result(){
    var pass=score>=Math.ceil(QN*PASS),pct=score/QN;
    if(S.quizBest==null||score>S.quizBest){S.quizBest=score;save();}
    el.innerHTML='<div class="quiz"><div class="dcard result"><svg class="ring" viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="42"/><circle class="val" cx="50" cy="50" r="42" stroke="'+(pass?'#2F9A7D':'#C9503C')+'" style="stroke-dasharray:0 264"/><text x="50" y="50">'+score+'/'+QN+'</text></svg>'+
      '<h3 style="font-size:24px">'+(pass?(score===QN?'Fantastisk – alt riktig!':'Bestått – godt jobbet!'):'Nesten der!')+'</h3><p class="muted" style="margin-top:6px">'+(pass?'Du har vist at du kan det viktigste i modul 1.':'Du trenger '+Math.ceil(QN*PASS)+' riktige. Se gjennom forklaringene under og prøv igjen – spørsmålene stokkes på nytt.')+'</p>'+
      '<div class="actions" style="justify-content:center"><button class="btn '+(pass?'btn-s':'btn-p')+'" id="rt">'+ic('refresh')+' Ta testen på nytt</button></div>'+
      '<div class="review">'+log.map(function(l){return '<div class="'+(l.ok?'':'no')+'"><b>'+(l.ok?'✓':'✗')+'</b> '+l.q+'<br><span class="muted">'+l.why+'</span></div>';}).join('')+'</div></div></div>';
    setTimeout(function(){var c=$('.ring .val',el);if(c)c.style.strokeDasharray=(pct*263.9)+' 263.9';},100);
    $('#rt',el).addEventListener('click',start);
    if(pass){award('quizpass',30);confetti();ctx.complete();}
  }
  intro();
}});

/* ---------- Fullført ---------- */
L.push({id:'ferdig',sec:'1.5 Oppsummering og sluttest',title:'Modul 1 fullført',icon:'flag',
html:function(){
  return '<div class="cert rv"><div class="medal">'+ic('shield')+'</div>'+
  '<div class="eyebrow" style="position:relative;z-index:1">SIKRE-trinn S fullført</div>'+
  '<h1 class="t" style="margin-bottom:6px">Du ser nå hva som skal beskyttes</h1>'+
  '<p class="lede" style="margin:0 auto;position:relative;z-index:1">Du har kartlagt dine digitale verdier, funnet kronjuvelene dine og lært de tre målene for all beskyttelse. Det er fundamentet for resten av kurset.</p>'+
  '<div class="kpis"><div class="kpi"><b data-count="'+S.pts+'">0</b><small>poeng</small></div><div class="kpi"><b data-count="'+itemCount()+'">0</b><small>verdier i kartet</small></div><div class="kpi"><b>'+S.stars.length+'</b><small>kronjuveler</small></div><div class="kpi"><b>'+(S.quizBest!=null?S.quizBest+'/'+QN:'–')+'</b><small>sluttest</small></div></div>'+
  '<div class="actions" style="justify-content:center;position:relative;z-index:1"><button class="btn btn-p" id="dl">'+ic('download')+' Last ned Min SIKRE-plan</button><button class="btn btn-s" id="pr">'+ic('print')+' Skriv ut</button></div></div>'+
  '<div class="next rv" style="--d:2"><div class="L">I</div><div><b>Neste: Modul 2 – Identifiser trusler og risiko</b><p>Du tar med deg verdikartet ditt og legger truslene oppå det: phishing, smishing, deepfakes, QR-svindel og de nye truslene i 2026.</p></div></div>';
},
mount:function(r,ctx){
  if(!S.finished){S.finished=new Date().toISOString();save();}
  countUp(r);$('#dl',r).addEventListener('click',download);$('#pr',r).addEventListener('click',printPlan);
  ctx.complete();setTimeout(confetti,400);
}});

/* =========================================================
   Motor: navigasjon, fremdrift, poeng
   ========================================================= */
var stage=$('#m1-stage'),nav=$('#m1-nav'),btnPrev=$('#m1-prev'),btnNext=$('#m1-next'),hint=$('#m1-hint'),root=$('#m1');
function firstOpen(){for(var i=0;i<L.length;i++){if(!S.done[L[i].id])return i;}return L.length-1;}
function canGo(i){return i<=firstOpen()||!!S.done[L[i].id];}
function pct(){var n=0;L.forEach(function(l){if(S.done[l.id])n++;});return Math.round(n/L.length*100);}

function award(key,n){if(S.got[key])return;S.got[key]=1;S.pts+=n;save();renderPts(true);}
function renderPts(bump){var p=$('#m1-pts');p.innerHTML=ic('star')+' '+S.pts+' <span>poeng</span>';if(bump){p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');}}

function renderNav(){
  var sec=null,out='';
  L.forEach(function(l,i){
    if(l.sec!==sec){sec=l.sec;out+='<h4>'+h(sec)+'</h4>';}
    var d=!!S.done[l.id],cur=i===S.cur,ok=canGo(i);
    out+='<button data-i="'+i+'" class="'+(d?'done ':'')+(cur?'cur':'')+'" '+(ok?'':'disabled')+(cur?' aria-current="step"':'')+'><span class="st">'+(d?ic('check'):ok?(i+1):ic('lock'))+'</span><span>'+h(l.title)+'</span></button>';
  });
  nav.innerHTML=out;
  $$('button',nav).forEach(function(b){b.addEventListener('click',function(){go(+b.dataset.i);root.classList.remove('open');});});
  var p=pct();$('#m1-bar').style.width=p+'%';$('#m1-pct').textContent=p+' %';
}

function renderFoot(){
  var l=L[S.cur],d=!!S.done[l.id];
  btnPrev.disabled=S.cur===0;
  btnPrev.innerHTML=ic('left')+'<span class="lbl-t"> Forrige</span>';
  if(S.cur===L.length-1){btnNext.style.visibility='hidden';}else btnNext.style.visibility='visible';
  var gated=l.gate&&!d;
  btnNext.disabled=gated;
  btnNext.innerHTML=(S.cur===L.length-2?'Fullfør':'Neste')+' '+ic('right');
  hint.className='hint'+(d&&l.gate?' ok':'');
  hint.innerHTML=gated?ic('lock')+' Fullfør oppgaven for å gå videre':(d&&l.gate?ic('check')+' Steg fullført':'Steg '+(S.cur+1)+' av '+L.length);
}

function makeCtx(l){
  return {
    done:!!S.done[l.id],
    complete:function(){
      if(S.done[l.id])return;S.done[l.id]=true;this.done=true;award('lesson:'+l.id,10);save();renderNav();renderFoot();
      if(l.gate){toast('Steg fullført! +10 poeng','check');btnNext.classList.remove('ready');void btnNext.offsetWidth;btnNext.classList.add('ready');}
    },
    uncomplete:function(){
      if(!S.done[l.id])return;
      /* Kun for steg som kan «angres» (valg av stjerner / tabell). Senere steg forblir tilgjengelige. */
      delete S.done[l.id];this.done=false;save();renderNav();renderFoot();
    }
  };
}

function go(i){
  if(i<0||i>=L.length||!canGo(i))return;
  S.cur=i;save();
  var l=L[i];
  stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');
  stage.innerHTML=l.html();
  var ctx=makeCtx(l);
  if(l.mount)l.mount(stage,ctx);
  countUpVisible();
  renderNav();renderFoot();
  var top=$('.m1-main').getBoundingClientRect().top+window.pageYOffset-80;
  if(window.pageYOffset>top)window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  var hd=$('h1',stage);if(hd){hd.setAttribute('tabindex','-1');try{hd.focus({preventScroll:true});}catch(e){}}
}
function countUpVisible(){$$('[data-count]',stage).forEach(function(n){var hidden=false,p=n;while(p&&p!==stage){if(p.style&&p.style.display==='none'){hidden=true;break;}p=p.parentNode;}if(!hidden)countUp({querySelectorAll:function(){return [n];}});});}

btnNext.addEventListener('click',function(){
  var l=L[S.cur];
  if(!l.gate&&!S.done[l.id])makeCtx(l).complete();
  if(S.done[l.id])go(S.cur+1);
});
btnPrev.addEventListener('click',function(){go(S.cur-1);});

/* Mobilmeny */
var menu=$('#m1-menu');menu.innerHTML=ic('menu');
menu.addEventListener('click',function(){var o=root.classList.toggle('open');menu.setAttribute('aria-expanded',o);});
$('#m1-scrim').addEventListener('click',function(){root.classList.remove('open');menu.setAttribute('aria-expanded','false');});
document.addEventListener('keydown',function(e){if(e.key==='Escape')root.classList.remove('open');});

/* Tilbakestill */
var rs=$('#m1-reset');rs.innerHTML=ic('refresh')+' Start modulen på nytt';
rs.addEventListener('click',function(){if(confirm('Vil du slette all fremdrift, alle svar og verdikartet ditt for modul 1? Dette kan ikke angres.')){S=fresh();save();renderPts();go(0);toast('Modulen er tilbakestilt','refresh');}});

/* Toast */
var toastT;
function toast(msg,icon){var t=$('#m1-toast');t.innerHTML=ic(icon||'check')+' '+h(msg);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2400);}

/* Konfetti */
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=$('#m1-confetti'),x=c.getContext('2d');if(!x)return;
  var W=c.width=window.innerWidth,H=c.height=window.innerHeight,cols=['#F5A623','#2F9A7D','#2F74B5','#C9503C','#6E54B8','#FFC45C'],P=[];
  for(var i=0;i<160;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  var t0=null;
  function f(ts){if(!t0)t0=ts;var el=ts-t0;x.clearRect(0,0,W,H);
    P.forEach(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-el/3200);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(el<3200)requestAnimationFrame(f);else x.clearRect(0,0,W,H);}
  requestAnimationFrame(f);
}

/* Start */
$('.m1-logo').innerHTML=ic('shield');
renderPts();
if(!canGo(S.cur))S.cur=firstOpen();
go(S.cur);
})();
</script>
